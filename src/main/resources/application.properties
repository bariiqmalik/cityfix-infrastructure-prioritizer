server.port=8080

# Database Configuration (Default: In-Memory PostgreSQL/MySQL compliant H2)
# To connect to external PostgreSQL, set:
# spring.datasource.url=jdbc:postgresql://localhost:5432/cityfix_db
# spring.datasource.username=postgres
# spring.datasource.password=secret
# spring.datasource.driver-class-name=org.postgresql.Driver

# Default embedded configuration for zero-friction launch:
spring.datasource.url=jdbc:h2:mem:cityfix;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Standalone JDBC DAO properties
db.url=jdbc:h2:mem:cityfix;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.username=sa
db.password=

# Spring Boot Static Resources
spring.web.resources.static-locations=classpath:/static/

